<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Fireworks Simulator</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #03050d;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    canvas {
      display: block;
    }

    .hud {
      position: fixed;
      left: 16px;
      bottom: 14px;
      color: rgba(236, 242, 255, 0.82);
      font-size: 13px;
      line-height: 1.45;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      user-select: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.166.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.166.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="hud">クリック: 花火を1発発射 / ドラッグ: カメラ回転 / ホイール: ズーム</div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x03050d);
    scene.fog = new THREE.FogExp2(0x03050d, 0.018);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 18, 42);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 6, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 12;
    controls.maxDistance = 90;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.update();

    const clock = new THREE.Clock();
    const rockets = [];
    const explosions = [];
    const gravity = new THREE.Vector3(0, -9.8, 0);
    const launcherPosition = new THREE.Vector3(0, 0.65, 0);

    buildWorld();
    window.addEventListener('resize', onResize);
    renderer.domElement.addEventListener('click', fireRocket);
    animate();

    function buildWorld() {
      const ambient = new THREE.AmbientLight(0x8ea4d9, 0.42);
      scene.add(ambient);

      const moon = new THREE.DirectionalLight(0xb8c7ff, 1.25);
      moon.position.set(-18, 28, 22);
      scene.add(moon);

      const launcherLight = new THREE.PointLight(0xffc36a, 45, 22, 1.7);
      launcherLight.position.set(0, 3, 3);
      scene.add(launcherLight);

      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(95, 96),
        new THREE.MeshStandardMaterial({
          color: 0x101723,
          roughness: 0.92,
          metalness: 0.02
        })
      );
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      const grid = new THREE.GridHelper(70, 35, 0x334466, 0x1b2638);
      grid.material.opacity = 0.33;
      grid.material.transparent = true;
      scene.add(grid);

      const base = new THREE.Mesh(
        new THREE.CylinderGeometry(1.35, 1.65, 0.42, 32),
        new THREE.MeshStandardMaterial({ color: 0x3d4658, roughness: 0.55, metalness: 0.28 })
      );
      base.position.y = 0.21;
      scene.add(base);

      const tube = new THREE.Mesh(
        new THREE.CylinderGeometry(0.34, 0.46, 2.4, 28),
        new THREE.MeshStandardMaterial({ color: 0x5f6f84, roughness: 0.42, metalness: 0.45 })
      );
      tube.position.y = 1.52;
      tube.rotation.z = -0.13;
      scene.add(tube);

      const rim = new THREE.Mesh(
        new THREE.TorusGeometry(0.4, 0.06, 12, 28),
        new THREE.MeshStandardMaterial({ color: 0xd6b16a, roughness: 0.35, metalness: 0.75 })
      );
      rim.position.set(-0.16, 2.7, 0);
      rim.rotation.x = Math.PI / 2;
      rim.rotation.z = -0.13;
      scene.add(rim);

      const starGeometry = new THREE.BufferGeometry();
      const starCount = 900;
      const starPositions = new Float32Array(starCount * 3);
      const starColors = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i++) {
        const radius = 80 + Math.random() * 90;
        const theta = Math.random() * Math.PI * 2;
        const y = 18 + Math.random() * 82;
        starPositions[i * 3] = Math.cos(theta) * radius;
        starPositions[i * 3 + 1] = y;
        starPositions[i * 3 + 2] = Math.sin(theta) * radius;
        const brightness = 0.55 + Math.random() * 0.45;
        starColors[i * 3] = brightness;
        starColors[i * 3 + 1] = brightness;
        starColors[i * 3 + 2] = brightness + Math.random() * 0.12;
      }
      starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
      starGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
      const stars = new THREE.Points(
        starGeometry,
        new THREE.PointsMaterial({
          size: 0.12,
          vertexColors: true,
          transparent: true,
          opacity: 0.78,
          depthWrite: false
        })
      );
      scene.add(stars);
    }

    function fireRocket(event) {
      if (event.button !== 0) return;

      const hue = Math.random();
      const color = new THREE.Color().setHSL(hue, 0.92, 0.62);
      const shell = new THREE.Mesh(
        new THREE.SphereGeometry(0.16, 16, 16),
        new THREE.MeshBasicMaterial({ color })
      );
      shell.position.copy(launcherPosition);
      scene.add(shell);

      const sparkGeometry = new THREE.BufferGeometry();
      sparkGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, 0, 0]), 3));
      const trail = new THREE.Points(
        sparkGeometry,
        new THREE.PointsMaterial({
          color,
          size: 0.65,
          transparent: true,
          opacity: 0.9,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        })
      );
      trail.position.copy(shell.position);
      scene.add(trail);

      rockets.push({
        mesh: shell,
        trail,
        color,
        velocity: new THREE.Vector3((Math.random() - 0.5) * 1.6, 18 + Math.random() * 7, (Math.random() - 0.5) * 1.6),
        fuse: 1.15 + Math.random() * 0.45
      });
    }

    function explode(position, baseColor) {
      const count = 180 + Math.floor(Math.random() * 90);
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const velocities = [];
      const color = baseColor.clone();

      for (let i = 0; i < count; i++) {
        const direction = new THREE.Vector3(
          Math.random() * 2 - 1,
          Math.random() * 2 - 1,
          Math.random() * 2 - 1
        ).normalize();
        const speed = 5 + Math.random() * 11;
        velocities.push(direction.multiplyScalar(speed));
        positions[i * 3] = 0;
        positions[i * 3 + 1] = 0;
        positions[i * 3 + 2] = 0;

        const particleColor = color.clone().offsetHSL((Math.random() - 0.5) * 0.08, 0, (Math.random() - 0.5) * 0.22);
        colors[i * 3] = particleColor.r;
        colors[i * 3 + 1] = particleColor.g;
        colors[i * 3 + 2] = particleColor.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.34,
        vertexColors: true,
        transparent: true,
        opacity: 1,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const points = new THREE.Points(geometry, material);
      points.position.copy(position);
      scene.add(points);

      const flash = new THREE.PointLight(baseColor, 90, 36, 2);
      flash.position.copy(position);
      scene.add(flash);

      explosions.push({
        points,
        material,
        flash,
        velocities,
        age: 0,
        lifetime: 2.2 + Math.random() * 0.5
      });
    }

    function updateRockets(delta) {
      for (let i = rockets.length - 1; i >= 0; i--) {
        const rocket = rockets[i];
        rocket.fuse -= delta;
        rocket.velocity.addScaledVector(gravity, delta * 0.22);
        rocket.mesh.position.addScaledVector(rocket.velocity, delta);
        rocket.trail.position.copy(rocket.mesh.position);
        rocket.trail.material.opacity = 0.35 + Math.sin(clock.elapsedTime * 32) * 0.18;

        if (rocket.fuse <= 0 || rocket.velocity.y <= 1.5) {
          explode(rocket.mesh.position, rocket.color);
          scene.remove(rocket.mesh, rocket.trail);
          rocket.mesh.geometry.dispose();
          rocket.mesh.material.dispose();
          rocket.trail.geometry.dispose();
          rocket.trail.material.dispose();
          rockets.splice(i, 1);
        }
      }
    }

    function updateExplosions(delta) {
      for (let i = explosions.length - 1; i >= 0; i--) {
        const explosion = explosions[i];
        explosion.age += delta;
        const positionAttribute = explosion.points.geometry.attributes.position;
        const positions = positionAttribute.array;

        for (let j = 0; j < explosion.velocities.length; j++) {
          const velocity = explosion.velocities[j];
          velocity.addScaledVector(gravity, delta * 0.82);
          velocity.multiplyScalar(1 - delta * 0.18);
          positions[j * 3] += velocity.x * delta;
          positions[j * 3 + 1] += velocity.y * delta;
          positions[j * 3 + 2] += velocity.z * delta;
        }

        positionAttribute.needsUpdate = true;
        const life = explosion.age / explosion.lifetime;
        explosion.material.opacity = Math.max(0, 1 - life);
        explosion.material.size = 0.34 + life * 0.26;
        explosion.flash.intensity = Math.max(0, 90 * (1 - life * 3.2));

        if (life >= 1) {
          scene.remove(explosion.points, explosion.flash);
          explosion.points.geometry.dispose();
          explosion.material.dispose();
          explosions.splice(i, 1);
        }
      }
    }

    function animate() {
      const delta = Math.min(clock.getDelta(), 0.033);
      updateRockets(delta);
      updateExplosions(delta);
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
